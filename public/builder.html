<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder - IPLC ArticEval</title>
    
    <!-- Bootstrap CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SurveyJS Form Library resources (MIT Licensed - Free) -->
    <link href="https://unpkg.com/survey-core/survey-core.min.css" type="text/css" rel="stylesheet">
    <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script>
    
    <!-- SurveyJS Creator resources (Commercial License Required) -->
    <link href="https://unpkg.com/survey-creator-core/survey-creator-core.min.css" type="text/css" rel="stylesheet">
    <script src="https://unpkg.com/survey-creator-core/survey-creator-core.min.js"></script>
    <script src="https://unpkg.com/survey-creator-js/survey-creator-js.min.js"></script>
    
    <!-- SurveyJS Widgets for signature support -->
    <script src="/assets/js/surveyjs-widgets.min.js"></script>
    <!-- Note: surveyjs-widgets doesn't include a CSS file - styles are embedded in the JS -->
    
    <!-- Signature Pad library -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="/assets/css/builder-inline.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button class="btn btn-secondary" onclick="exitBuilder()" style="padding: 0.5rem;">
                ← Back
            </button>
            <h1>IPLC Form Builder</h1>
        </div>
        <div class="header-actions">
            <div id="autoSaveIndicator" style="display: none; color: #28a745; font-size: 0.875rem; margin-right: 1rem; align-self: center;">
                ✓ Draft saved
            </div>
            <button class="btn btn-primary" onclick="saveForm()">
                Save Template
            </button>
        </div>
    </div>
    
    <!-- Form Builder Container -->
    <div id="builder-container"></div>
    
    <!-- Preview Modal -->
    <div id="preview-modal" class="preview-modal">
        <div class="preview-content">
            <div class="preview-header">
                <h2>Form Preview</h2>
                <button class="close-preview" onclick="closePreview()">&times;</button>
            </div>
            <div class="preview-body">
                <div id="preview-survey"></div>
            </div>
        </div>
    </div>
    
    <!-- Load the modular form builder bundle -->
    <script type="module">
        import { initFormBuilder } from './assets/js/form-builder/index.js';
        import './assets/js/form-builder-tour.js';
        import './assets/js/ai-summary-renderer.js';
        
        // Create a FormBuilder class that wraps the initFormBuilder function
        class FormBuilder {
            constructor(containerId) {
                this.containerId = containerId;
                this.container = document.getElementById(containerId);
                this.hasUnsavedChanges = false;
                this.formData = null;
                this._init();
            }
            
            async _init() {
                // Initialize the form builder using the function-based API
                this.builder = await initFormBuilder({
                    canvasElement: this.container,
                    toolboxElement: document.getElementById('toolbox-container'),
                    headerElement: document.getElementById('header-container')
                });
                
                // Track changes
                this.builder.stateManager.on('stateChange', () => {
                    this.hasUnsavedChanges = true;
                });
            }
            
            async save() {
                try {
                    this.formData = this.builder.getFormData();
                    // TODO: Implement actual save logic
                    console.log('Saving form data:', this.formData);
                    this.hasUnsavedChanges = false;
                    return true;
                } catch (error) {
                    console.error('Error saving form:', error);
                    return false;
                }
            }
        }
        
        // Make FormBuilder available as IPLCFormBuilder for backward compatibility
        window.IPLCFormBuilder = FormBuilder;
    </script>

    <script>
        // Initialize the form builder
        let formBuilder;
        
        // Exit builder with confirmation
        function exitBuilder() {
            if (formBuilder && formBuilder.hasUnsavedChanges) {
                if (!confirm('You have unsaved changes. Are you sure you want to leave?')) {
                    return;
                }
            }
            window.location.href = '/form-dashboard.html';
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            try {
                // Initialize widgets for signature support
                if (window.SurveyJS && window.SurveyJS.widgets && window.SurveyJS.widgets.signaturepad) {
                    window.SurveyJS.widgets.signaturepad(Survey);
                }
                
                // Initialize SurveyJS Creator
                const creatorOptions = {
                    showLogicTab: true,
                    showJSONEditorTab: true,
                    showTranslationTab: false,
                    showEmbeddedSurveyTab: false,
                    showTestSurveyTab: true,
                    showThemeTab: false
                };
                
                // Create the creator instance and assign to window for global access
                window.creator = new SurveyCreator.SurveyCreator(creatorOptions);
                
                formBuilder = new IPLCFormBuilder('builder-container');
                
                // Check if we're editing an existing template
                const urlParams = new URLSearchParams(window.location.search);
                const templateId = urlParams.get('id');
                
                if (templateId) {
                    loadTemplate(templateId);
                }
                
            } catch (error) {
                console.error('Error initializing form builder:', error);
                document.getElementById('builder-container').innerHTML = `
                    <div class="empty-state">
                        <h3>Error Loading Form Builder</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
        
        // Load existing template
        async function loadTemplate(templateId) {
            try {
                const response = await fetch(`/api/forms/templates/${templateId}`);
                if (!response.ok) throw new Error('Failed to load template');
                
                const template = await response.json();
                // TODO: Load template into form builder
                console.log('Template loaded:', template);
            } catch (error) {
                console.error('Error loading template:', error);
            }
        }
        
        
        // Save form
        async function saveForm() {
            if (!formBuilder) return;
            
            // Use the form builder's save method which handles everything
            const success = await formBuilder.save();
            
            if (success) {
                // Redirect to dashboard after successful save
                window.location.href = '/form-dashboard.html';
            }
        }
    </script>
</body>
</html>
