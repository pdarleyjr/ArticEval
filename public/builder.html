<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder - IPLC ArticEval</title>
    <!-- SurveyJS Form Library resources -->
    <link href="https://unpkg.com/survey-core/survey-core.min.css" type="text/css" rel="stylesheet">
    <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script>
    
    <!-- Survey Creator resources -->
    <link href="https://unpkg.com/survey-creator-core/survey-creator-core.min.css" type="text/css" rel="stylesheet">
    <script src="https://unpkg.com/survey-creator-core/survey-creator-core.min.js"></script>
    <script src="https://unpkg.com/survey-creator-js/survey-creator-js.min.js"></script>
</head>
<body>
    <div id="surveyCreator" style="height: 100vh;"></div>
    
    <script type="text/javascript">
        try {
            const creatorOptions = {
                showLogicTab: true,
                isAutoSave: true
            };
            
            // The IIFE distribution attaches the SurveyCreator object to the window.
            const creator = new SurveyCreator.SurveyCreator(creatorOptions);
            
            // The render method is guaranteed to exist in this distribution.
            creator.render(document.getElementById("surveyCreator"));
            
        } catch (error) {
            console.error('Error during SurveyJS initialization:', error);
            document.getElementById("surveyCreator").innerText = 'Failed to load Survey Creator: ' + error.message;
        }
    </script>
</body>
</html>
