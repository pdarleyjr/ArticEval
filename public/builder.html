<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder - IPLC ArticEval</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
    
    <!-- SurveyJS CSS is now included via the JS bundle -->
</head>
<body>
    <header class="logo-header">
        <img src="/assets/images/400dpiLogo.PNG" alt="IPLC Logo" />
    </header>

    <!-- This will be replaced by the SurveyJS Creator UI -->
    <div id="surveyCreator" style="height: calc(100vh - 80px);"></div>
    
    <!-- The bundle contains SurveyJS libraries and their initialization -->
    <script type="module" src="/bundle.js"></script>
    
    <!-- The script to render the component -->
    <script type="module">
        // The `SurveyCreatorModel` class is augmented by the `survey-creator-js` import
        // inside of `main.js`, which is part of the bundle.
        // `main.js` also attaches `SurveyCreatorCore` to the window object.
        
        try {
            if (typeof SurveyCreatorCore === "undefined" || typeof SurveyCreatorCore.SurveyCreatorModel === "undefined") {
              throw new Error("SurveyCreatorCore or SurveyCreatorModel not found on the window object. Check bundle.js.");
            }
        
            const creatorOptions = {
                showLogicTab: true,
                isAutoSave: true
            };
            
            // Instantiate the creator
            const creator = new SurveyCreatorCore.SurveyCreatorModel(creatorOptions);
            
            // The `render` method should exist if `survey-creator-js` is imported correctly.
            if (typeof creator.render !== "function") {
                throw new Error("creator.render is not a function. Check that 'survey-creator-js' is being imported and is attaching the method to the SurveyCreatorModel prototype.");
            }
            
            // Render the creator in the container
            creator.render(document.getElementById("surveyCreator"));
            
        } catch (error) {
            console.error(error);
            document.getElementById("surveyCreator").innerText = 'Error: ' + error.message;
        }
    </script>
</body>
</html>
