<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder - IPLC ArticEval</title>
    <!-- Using a reliable CDN for the SurveyJS assets -->
    <script src="https://cdn.jsdelivr.net/npm/survey-creator-knockout@1.9.143/survey-creator-knockout.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/survey-core@1.9.143/survey.min.css" type="text/css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/survey-creator-core@1.9.143/survey-creator-core.min.css" type="text/css" rel="stylesheet">
</head>
<body>
    <div id="surveyCreator" style="height: 100vh;"></div>
    
    <script type="text/javascript">
        try {
            const creatorOptions = {
                showLogicTab: true,
                isAutoSave: true
            };
            
            // The IIFE distribution attaches the SurveyCreator object to the window.
            const creator = new SurveyCreator.SurveyCreator(creatorOptions);
            
            // The render method is guaranteed to exist in this distribution.
            creator.render(document.getElementById("surveyCreator"));
            
        } catch (error) {
            console.error('Error during SurveyJS initialization:', error);
            document.getElementById("surveyCreator").innerText = 'Failed to load Survey Creator: ' + error.message;
        }
    </script>
</body>
</html>
