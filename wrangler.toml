name = "articeval"
compatibility_date = "2025-07-01"
pages_build_output_dir = "public"
compatibility_flags = ["nodejs_compat"]

# Database binding for form data storage
[[d1_databases]]
binding = "DB"
database_name = "iplc-eval-db"
database_id = "690d60be-7ba3-4a2c-8de9-4cd8f034430e"

# Vectorize binding for chat knowledge base
[[vectorize]]
binding = "VECTORIZE"
index_name = "chat-knowledge-index"

# KV namespace for chat metadata
[[kv_namespaces]]
binding = "CHAT_METADATA"
id = "29cc6219f29d48d1a5ddd38dcda1a0f0"

# Workers AI binding for embeddings
[ai]
binding = "AI"

# Production environment
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "iplc-eval-db"
database_id = "690d60be-7ba3-4a2c-8de9-4cd8f034430e"

[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "chat-knowledge-index"

[[env.production.kv_namespaces]]
binding = "CHAT_METADATA"
id = "29cc6219f29d48d1a5ddd38dcda1a0f0"

[env.production.ai]
binding = "AI"

# Rate limiting is implemented using KV storage
# since Cloudflare Pages doesn't support [[unsafe.bindings]]